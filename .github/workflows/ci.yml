name: CI

# Streamlit Community Cloud は main への push を検知して自動で再デプロイする。
# （SCCには外部からデプロイを叩くAPIがないため、CIからデプロイは行えない）
# このワークフローはその手前の品質ゲートとして動かす。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 は devcontainer に合わせたもの、3.14 は Streamlit Community
        # Cloud のビルド環境が現在使っているバージョンに合わせたもの
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 構文チェック
        run: python -m compileall -q streamlit_app.py pdf-shrink-split.py tests

      - name: テスト
        run: python -m pytest tests -v

  pinned-requirements:
    # requirements.txt が固定されていないと、SCCの再ビルドで
    # デプロイ版の挙動が勝手に変わるため、ピン留めを強制する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: requirements.txt がピン留めされているか確認
        run: |
          python - <<'PY'
          import re
          import sys

          unpinned = []
          for line in open("requirements.txt", encoding="utf-8"):
              line = line.split("#")[0].strip()
              if not line or line.startswith("-"):
                  continue
              if not re.search(r"(==|@)", line):
                  unpinned.append(line)

          if unpinned:
              print("バージョンが固定されていない依存があります:")
              for name in unpinned:
                  print(f"  - {name}")
              print()
              print("Streamlit Community Cloud は再ビルドのたびに最新版を"
                    "取得するため、'パッケージ名==バージョン' の形で"
                    "固定してください。")
              sys.exit(1)

          print("requirements.txt はすべて固定されています。")
          PY
